packages:
  - "packages/*"

# Require packages to be at least 14 days old before being allowed to be installed
minimumReleaseAge: 20160
# Already-locked versions younger than 14 days when this policy was introduced;
# remove these once they have aged past the cutoff.
minimumReleaseAgeExclude:
  - "@readme/openapi-parser@10.0.0"
  - "@turbo/darwin-64@2.11.10"
  - "@turbo/darwin-arm64@2.11.10"
  - "@turbo/linux-64@2.11.10"
  - "@turbo/linux-arm64@2.11.10"
  - "@turbo/windows-64@2.11.10"
  - "@turbo/windows-arm64@2.11.10"
  - "api@7.0.4"
  - "argparse@3.0.3"
  - "fast-uri@3.1.9"
  - "js-yaml@5.5.0"
  - "oas-normalize@18.0.3"
  - "oas@38.7.0"
  - "qs@6.16.1"
  - "remove-undefined-objects@9.0.2"
  - "turbo@2.11.10"
  - "undici@6.29.1"

overrides:
  image-size@<2.0.3: ^2.0.3

# pnpm 10 never ran these build scripts (not approved); keep it that way explicitly
allowBuilds:
  "@biomejs/biome": false
  esbuild: false
